<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7fb">
  <title>로그인 | 남부발전 스마트 인수인계</title>
  <link rel="stylesheet" href="css/style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="js/supabase-client.js"></script>
  <script defer src="js/auth.js"></script>
</head>
<body data-page="auth">
  <main class="auth-shell" hidden>
    <a class="brand auth-brand" href="auth.html">
      <span class="brand-mark">SP</span>
      <span class="brand-copy"><strong>남부발전 스마트 인수인계</strong><span>SHIFT HANDOVER</span></span>
    </a>
    <section class="panel auth-card" aria-labelledby="auth-title">
      <p class="eyebrow">SHIFT HANDOVER</p>
      <h1 id="auth-title">로그인</h1>
      <p class="subtitle">이메일로 계정에 로그인하세요.</p>
      <div class="auth-tabs" role="tablist" aria-label="인증 방식">
        <button type="button" class="active" id="show-login" role="tab" aria-selected="true">로그인</button>
        <button type="button" id="show-signup" role="tab" aria-selected="false">회원가입</button>
      </div>
      <p id="auth-message" class="auth-message" role="status" aria-live="polite" hidden></p>
      <form id="login-form" class="auth-form">
        <div class="field"><label for="login-email">이메일</label><input id="login-email" name="email" type="email" autocomplete="email" required></div>
        <div class="field"><label for="login-password">비밀번호</label><input id="login-password" name="password" type="password" autocomplete="current-password" required></div>
        <button class="button primary auth-submit" type="submit">로그인</button>
      </form>
      <form id="signup-form" class="auth-form" hidden>
        <div class="field"><label for="signup-email">이메일</label><input id="signup-email" name="email" type="email" autocomplete="email" required></div>
        <div class="field"><label for="signup-password">비밀번호</label><input id="signup-password" name="password" type="password" autocomplete="new-password" minlength="6" required><small>비밀번호는 6자 이상 입력해 주세요.</small></div>
        <button class="button primary auth-submit" type="submit">회원가입</button>
      </form>
    </section>
    <p class="footer-note">계정 인증은 Supabase에서 안전하게 처리됩니다.</p>
  </main>
</body>
</html>
